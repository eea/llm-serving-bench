# Server launch config for the Qwen run (2026-08-04).
# Recovered from the docker-compose block that was commented into the original
# benchmark.sh — this is the only run whose server flags were actually recorded.
#
#   docker compose -f bench/serve/qwen3.6-27b-fp8.yml up -d
#   bench/run.sh --model qwen3.6-27b-fp8 --label "Qwen 27B" \
#     --base-url http://localhost:9000 --served-model qwen/qwen3.6-27b

services:
  qwen:
    image: vllm/vllm-openai:v0.25.0
    restart: unless-stopped
    ipc: host
    shm_size: "60g"
    ports:
      - "9000:8000"
    env_file: ./.env
    volumes:
      - ./data/models:/models
      - ./data/.cache:/root/.cache
    command: >
      --host 0.0.0.0
      --port 8000
      --served-model-name qwen/qwen3.6-27b
      --model Qwen/Qwen3.6-27B-FP8
      --trust_remote_code
      --quantization fp8
      --kv-cache-dtype fp8
      --max-model-len 262144
      --gpu-memory-utilization 0.95
      --enable-auto-tool-choice
      --enable-chunked-prefill
      --tool-call-parser qwen3_coder
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
