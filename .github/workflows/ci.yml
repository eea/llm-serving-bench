name: audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate: raw results must be internally consistent, and every table in
      # README.md plus data/leaderboard.json must match a fresh render.
      - name: ingest + freshness audit
        run: make check

      # Figures are built to prove they regenerate; PNG bytes are not diffed
      # (matplotlib embeds nondeterministic metadata).
      - name: rebuild figures
        run: |
          python -m pip install --quiet "matplotlib>=3.7"
          python analysis/figures.py
      - name: upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: docs/figures/*.png
